{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CineMetrics — Film Quality &amp; IMDb Rating Forecaster{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'predictor/img/logo_icon.png' %}">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Fonts: Mona Sans (CDN) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/mona-sans" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Matte Obsidian Bento Palette (FinPoint Inspired) */
            --bg-outer: #09090B;
            --bg-frame: #111113;
            --bg-bento: #17171A;
            --bg-subcard: #1F1F23;
            
            --border-frame: rgba(255, 255, 255, 0.07);
            --border-bento: rgba(255, 255, 255, 0.06);
            --border-subcard: rgba(255, 255, 255, 0.04);
            
            /* High-Contrast Solid Accents */
            --accent-vermilion: #F05228;
            --accent-vermilion-dark: #D83A1A;
            --accent-vermilion-gradient: linear-gradient(135deg, #F05228 0%, #D83A1A 100%);
            
            --accent-gold: #F5C426;
            --accent-mint: #34D399;
            --accent-cyan: #38BDF8;
            --accent-orange: #FB923C;
            
            /* Typography Colors - High Contrast for Readability */
            --text-primary: #FFFFFF;
            --text-heading: #FFFFFF;
            --text-secondary: #F1F5F9;
            --text-muted: #E2E8F0;
            
            --font-main: 'Mona Sans', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* Ensure all text classes are crystal clear white / high contrast */
        .text-secondary {
            color: #F1F5F9 !important;
        }
        .text-muted {
            color: #E2E8F0 !important;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            background-color: var(--bg-outer);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.018em;
            overflow-x: hidden;
            width: 100%;
        }

        .font-mono {
            font-family: var(--font-mono) !important;
            font-feature-settings: 'tnum' on, 'zero' on;
        }

        /* Diagonal Hatch Pattern Texture */
        .hatched-bg {
            background-color: #17171A;
            background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px, transparent 6px);
        }

        .hatched-bg-subtle {
            background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.035) 0px, rgba(255, 255, 255, 0.035) 1.5px, transparent 1.5px, transparent 6px);
        }

        /* Outer Frame Container (FinPoint Tablet Canvas) */
        .app-outer-wrapper {
            max-width: 1380px;
            margin: 20px auto;
            padding: 0 16px;
            width: 100%;
            overflow-x: hidden;
        }

        .app-main-frame {
            background-color: var(--bg-frame);
            border: 1px solid var(--border-frame);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.75);
            position: relative;
        }

        /* Mobile Responsiveness for App Canvas Frame */
        @media (max-width: 768px) {
            .app-outer-wrapper {
                margin: 8px auto;
                padding: 0 8px;
            }
            .app-main-frame {
                padding: 14px 10px;
                border-radius: 20px;
            }
            .bento-surface {
                border-radius: 20px;
            }
            .bento-surface.p-4 {
                padding: 1rem !important;
            }
        }

        /* Bento Surfaces */
        .bento-surface {
            background-color: var(--bg-bento);
            border: 1px solid var(--border-bento);
            border-radius: 26px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.25s ease;
        }
        .bento-surface:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .subcard-surface {
            background-color: var(--bg-subcard);
            border-radius: 18px;
            border: 1px solid var(--border-subcard);
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .subcard-surface:hover {
            background-color: #24242A;
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Metric Numbers */
        .metric-large {
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text-primary);
        }

        /* Circular Action Buttons (42x42px) */
        .btn-circle-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--bg-bento);
            border: 1px solid var(--border-bento);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-circle-icon:hover {
            background-color: #24242A;
            color: #FFFFFF;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .btn-circle-icon-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--bg-subcard);
            border: 1px solid var(--border-subcard);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-circle-icon-sm:hover {
            background-color: #2D2D35;
            color: #FFFFFF;
        }

        /* View Switching (Fade-Up Animation) */
        @keyframes fadeInView {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .view-pane {
            display: none;
        }
        .view-pane.active {
            display: block;
            animation: fadeInView 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090B;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272A;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3F3F46;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Main Container -->
    <main class="app-outer-wrapper">
        <div class="app-main-frame">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js for Data Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
